
{% extends "complaints/base.html" %}

{% block title %}Password Changed | SCMS{% endblock %}

{% block content %}
<div class="card">
    <h1>Your password has been changed</h1>
    <p>
        You can now log in with your e-mail address and your new
        password. The reset link you used is no longer valid.
    </p>
    <p>
        <a href="{% url 'login' %}" class="button">Log in</a>
    </p>
</div>
{% endblock %}
